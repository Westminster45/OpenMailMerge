# Runs the tests on every push and pull request. A green tick on GitHub means they all passed.
name: Tests

on:
  push:
  pull_request:

# Checking out and running the tests only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9
    strategy:
      matrix:
        # Oldest and newest Python that LibreOffice's built-in Python is likely to be.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
